    <section id="t-dash" class="space-y-4"><div id="stats" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div><div class="grid md:grid-cols-3 gap-4"><div class="md:col-span-2 bg-white border rounded-2xl p-5"><h3 class="font-black text-sm mb-3">مبيعات آخر 7 أيام (ج.م)</h3><div id="chart" class="flex items-end gap-2 h-44"></div></div><div class="bg-white border rounded-2xl p-5"><h3 class="font-black text-sm mb-3">حالات الطلبات</h3><div id="stBox"></div></div></div><div class="grid md:grid-cols-2 gap-4"><div class="bg-white border rounded-2xl p-5"><h3 class="font-black text-sm mb-3">أحدث الطلبات</h3><div id="lastO"></div></div><div class="bg-white border rounded-2xl p-5"><h3 class="font-black text-sm mb-3">تنبيهات المخزون</h3><div id="lowS"></div></div></div></section>

    <section id="t-products" class="hidden space-y-4">

            <select id="pCat" class="border rounded-xl p-2"><option value="smartwatch">ساعات ذكية</option><option value="earbuds">سماعات بلوتوث</option><option value="accessories">شواحن وباور بانك</option><option value="cases">جراب موبايل</option><option value="men">ملابس رجالي</option><option value="women">ملابس حريمي</option><option value="kids">ملابس أطفال</option><option value="shoes">شوزات</option></select>
            <input id="pSpecs" placeholder="المواصفات" class="border rounded-xl p-2">
            <input id="pPrice" type="number" min="0" required placeholder="السعر" class="border rounded-xl p-2">
            <input id="pOld" type="number" min="0" placeholder="السعر قبل الخصم" class="border rounded-xl p-2">
            <input id="pStock" type="number" min="0" required placeholder="المخزون" class="border rounded-xl p-2">
            <input id="pRate" type="number" step="0.1" min="1" max="5" placeholder="التقييم" class="border rounded-xl p-2">
            <input id="pImg" placeholder="رابط الصورة (أو ارفع صورة)" class="border rounded-xl p-2 col-span-2">
            <input type="file" accept="image/*" onchange="upImg(this)" class="text-xs col-span-2">
            <input id="pSizes" placeholder="المقاسات للملابس والشوزات (S, M, L أو 40, 41, 42)" class="border rounded-xl p-2 col-span-2 md:col-span-4"><input id="pNameEn" placeholder="اسم المنتج بالإنجليزي (اختياري)" class="border rounded-xl p-2 col-span-2"><input id="pSpecsEn" placeholder="المواصفات بالإنجليزي (اختياري)" class="border rounded-xl p-2 col-span-2"><input id="pOffer" type="number" min="0" placeholder="سعر العرض (لصفحة الإعلان)" class="border rounded-xl p-2 col-span-2"><input id="pOfferEnd" type="datetime-local" title="ينتهي العرض في" class="border rounded-xl p-2 col-span-2"><input id="pCost" type="number" min="0" placeholder="سعر التكلفة (لحساب الربح)" class="border rounded-xl p-2 col-span-2"><input id="pImgs" placeholder="روابط صور إضافية (مفصولة بفاصلة)" class="border rounded-xl p-2 col-span-2 md:col-span-4"><label class="col-span-2 md:col-span-4 text-xs text-slate-500">أو ارفع صور إضافية (تحتاج Cloudinary): <input type="file" accept="image/*" multiple onchange="upImgs(this)"></label><input id="pCols" placeholder="الألوان (أسود, أبيض, أحمر) - اختياري" class="border rounded-xl p-2 col-span-2"><label class="flex items-center gap-2 text-xs font-bold col-span-2"><input type="checkbox" id="pBest"> 🔥 الأكثر مبيعاً</label>
            <button class="bg-indigo-600 text-white rounded-xl py-2 font-bold col-span-2">حفظ المنتج</button>
            <button type="button" onclick="resetP()" class="bg-slate-100 rounded-xl py-2 font-bold col-span-2">مسح النموذج</button>
        </form>
        <div class="bg-white border rounded-2xl overflow-x-auto">
            <table class="w-full text-xs text-right"><thead class="bg-slate-100"><tr><th class="p-2"></th><th class="p-2">الاسم</th><th class="p-2">التصنيف</th><th class="p-2">السعر</th><th class="p-2">المخزون</th><th class="p-2"></th></tr></thead><tbody id="pTable"></tbody></table>
        </div>
    </section>

    <section id="t-orders" class="hidden space-y-3">
        <div class="flex flex-wrap gap-2 text-sm"><input id="oQ" oninput="filt()" placeholder="بحث برقم الطلب أو الاسم أو الهاتف" class="border rounded-xl p-2 flex-1 min-w-[180px]"><select id="oSt" onchange="filt()" class="border rounded-xl p-2"><option value="">كل الحالات</option><option>قيد المراجعة</option><option>تم إصدار بوليصة الشحن</option><option>قيد التجهيز</option><option>تم الشحن</option><option>تم التسليم</option><option>ملغي</option></select><button onclick="exportCSV()" class="bg-emerald-600 text-white rounded-xl px-4 font-bold">تصدير Excel</button></div>
        <div id="oList" class="space-y-3"></div></section>

    <section id="t-settings" class="hidden space-y-4">
        <form onsubmit="saveSettings(event)" class="bg-white border rounded-2xl p-4 space-y-3 text-sm">
            <h3 class="font-black">الشحن والكوبونات</h3>
            <label class="block text-xs font-bold">تكلفة الشحن لكل محافظة (سطر لكل محافظة: الاسم=السعر)</label>
            <textarea id="sShip" rows="8" class="w-full border rounded-xl p-2 text-xs"></textarea>
            <label class="block text-xs font-bold">شحن مجاني لو قيمة المنتجات تساوي أو تزيد عن (0 = معطّل)</label>
            <input id="sFree" type="number" min="0" class="w-full border rounded-xl p-2">
            <label class="block text-xs font-bold">كوبونات الخصم (سطر لكل كود: SAVE10=10% أو WELCOME=50)</label>
            <textarea id="sCoupons" rows="3" class="w-full border rounded-xl p-2 text-xs"></textarea>
            <label class="block text-xs font-bold">روابط التواصل الاجتماعي (تظهر في أسفل المتجر، اترك الفاضي لإخفائه)</label><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><input id="sFb" type="url" placeholder="رابط صفحة فيسبوك" class="border rounded-xl p-2 w-full text-xs"><input id="sTt" type="url" placeholder="رابط تيك توك" class="border rounded-xl p-2 w-full text-xs"><input id="sIg" type="url" placeholder="رابط انستجرام" class="border rounded-xl p-2 w-full text-xs"><input id="sWg" type="url" placeholder="رابط جروب واتساب" class="border rounded-xl p-2 w-full text-xs"><input id="sTg" type="url" placeholder="رابط تليجرام (قناة أو جروب)" class="border rounded-xl p-2 w-full text-xs"></div>
            <label class="block text-xs font-bold">خصم الكمية: عند شراء عدد قطع (0 = معطّل) بنسبة خصم %</label><div class="flex gap-2"><input id="sBQty" type="number" min="0" placeholder="عدد القطع" class="border rounded-xl p-2 flex-1"><input id="sBPct" type="number" min="0" max="90" placeholder="نسبة الخصم %" class="border rounded-xl p-2 flex-1"></div>
            <button class="bg-indigo-600 text-white rounded-xl px-4 py-2 font-bold">حفظ</button>
        </form>
        <form onsubmit="savePin(event)" class="bg-white border rounded-2xl p-4 flex gap-2 text-sm">
            <input id="newPin" type="password" required placeholder="رمز مرور جديد (4 أرقام على الأقل)" class="border rounded-xl p-2 flex-1">
            <button class="bg-indigo-600 text-white rounded-xl px-4 font-bold">تغيير الرمز</button>
        </form>
        <div class="bg-white border rounded-2xl p-4 flex flex-wrap gap-2 text-sm font-bold">
            <button onclick="testNotify()" class="bg-sky-600 text-white rounded-xl px-4 py-2">اختبار إشعار تليجرام</button>
            <button onclick="migrateImages()" class="bg-amber-600 text-white rounded-xl px-4 py-2">نقل صور المنتجات إلى Cloudinary</button>
            <button onclick="pushAll()" class="bg-indigo-600 text-white rounded-xl px-4 py-2">رفع بيانات هذا الجهاز للسحابة</button>
            <button onclick="backup()" class="bg-emerald-600 text-white rounded-xl px-4 py-2">تصدير نسخة احتياطية</button>
            <label class="bg-slate-100 rounded-xl px-4 py-2 cursor-pointer">استيراد نسخة<input type="file" accept=".json" onchange="restore(this)" class="hidden"></label>
        </div>
    </section>
</main>

<script>
const g = id => document.getElementById(id), f = id => g(id).value.trim();
const L = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } };
const S = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CAT = { smartwatch: 'ساعات ذكية', earbuds: 'سماعات بلوتوث', accessories: 'شواحن وباور بانك', cases: 'جراب موبايل', men: 'ملابس رجالي', women: 'ملابس حريمي', kids: 'ملابس أطفال', shoes: 'شوزات' };
const ST = ['قيد المراجعة', 'قيد التجهيز', 'تم إصدار بوليصة الشحن', 'تم الشحن', 'تم التسليم', 'ملغي'];
let P = L('hanzal_products', []), O = L('hanzal_orders', []);

function tab(t) { document.querySelectorAll('.tb').forEach(b => b.className = 'tb px-4 py-2 rounded-xl whitespace-nowrap ' + (b.dataset.t === t ? 'bg-slate-900 text-white' : 'bg-white border')); ['dash', 'products', 'orders', 'settings'].forEach(x => g('t-' + x).classList.toggle('hidden', x !== t)); render(); }
function logout() { localStorage.removeItem('hanzal_is_logged_in'); location.href = 'login.html'; }

function render() {
    P = L('hanzal_products', []); O = L('hanzal_orders', []);
    const rev = O.filter(o => o.status !== 'ملغي').reduce((s, o) => s + (parseFloat(o.total) || 0), 0);
    g('stats').innerHTML = [['المنتجات', P.length, 'box'], ['الطلبات', O.length, 'receipt'], ['الإيرادات', rev + ' ج.م', 'coins'], ['مخزون منخفض (≤3)', P.filter(p => p.stock <= 3).length, 'triangle-exclamation']]
        .map(([a, b, i]) => `<div class="bg-white border rounded-2xl p-5"><i class="fa-solid fa-${i} text-indigo-600"></i><p class="text-2xl font-black mt-2">${b}</p><p class="text-xs text-slate-500">${a}</p></div>`).join('');
    g('pTable').innerHTML = P.map(p => `<tr class="border-t"><td class="p-2"><img src="${esc(p.image)}" class="w-10 h-10 rounded-lg object-cover"></td><td class="p-2 font-bold">${esc(p.name)}</td><td class="p-2">${CAT[p.category] || ''}</td><td class="p-2">${+p.price}</td><td class="p-2 ${p.stock <= 3 ? 'text-red-600 font-bold' : ''}">${+p.stock}</td><td class="p-2 whitespace-nowrap"><button onclick="copyLink(${p.id})" title="نسخ رابط صفحة الإعلان" class="text-emerald-600 ml-3"><i class="fa-solid fa-link"></i></button><button onclick="editP(${p.id})" class="text-indigo-600 ml-3"><i class="fa-solid fa-pen"></i></button><button onclick="delP(${p.id})" class="text-red-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('') || '<tr><td colspan="6" class="p-6 text-center text-slate-400">لا توجد منتجات</td></tr>';
    g('oList').innerHTML = O.map((o, i) => `<div class="bg-white border rounded-2xl p-4 text-sm space-y-2">
        <div class="flex justify-between font-black"><span>${esc(o.id)} • ${esc(o.name)}</span><span class="text-indigo-600">${esc(o.total)}</span></div>
        <p class="text-xs text-slate-500">${esc(o.date || '')} • ${esc(o.phone)} • ${esc(o.address)}</p>
        <p class="text-xs">${(o.items || []).map(x => esc(x.name) + ' × ' + +x.qty).join('، ') || '—'}</p>
        <div class="flex flex-wrap gap-2 items-center">
            <select onchange="setSt(${i},this.value)" class="border rounded-lg p-1.5 text-xs">${ST.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
            <select onchange="waMsg(${i},this)" class="border rounded-lg p-1.5 text-xs text-emerald-700"><option value="">رسالة واتساب...</option><option value="0">تأكيد الطلب</option><option value="1">تم الشحن</option><option value="2">المندوب في الطريق</option></select><a target="_blank" href="https://wa.me/${esc(String(o.phone).replace(/\D/g, '').replace(/^0/, '20'))}" class="text-emerald-600 text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
            <button onclick="delO(${i})" class="text-red-600 text-xs mr-auto">حذف</button>
        </div></div>`).join('') || '<p class="text-center text-slate-400 py-12">لا توجد طلبات بعد</p>';
}

function saveP(e) {
    e.preventDefault();
    const d = { name: f('pName'), category: f('pCat'), price: +f('pPrice'), oldPrice: +f('pOld') || +f('pPrice') + 200, stock: +f('pStock'), rating: +f('pRate') || 5, image: f('pImg') || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MDAgNDAwIj48cmVjdCB3aWR0aD0iNTAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2YxZjVmOSIvPjxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzk0YTNiOCIgc3Ryb2tlLXdpZHRoPSIxMCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB4PSIyMDUiIHk9IjEzMCIgd2lkdGg9IjkwIiBoZWlnaHQ9IjEwMCIgcng9IjI2Ii8+PHBhdGggZD0iTTIyNSAxMzBsNi0zNmgzOGw2IDM2TTIyNSAyMzBsNiAzNmgzOGw2LTM2Ii8+PHBhdGggZD0iTTI1MCAxNjB2MjhsMTggMTAiLz48L2c+PC9zdmc+', specs: f('pSpecs') };
    const id = +f('pId');
    if (id) P = P.map(p => p.id === id ? { ...p, ...d } : p);
    else { d.id = Math.max(0, ...P.map(p => p.id)) + 1; P.push(d); }
    S('hanzal_products', P); resetP(); render();
}
function editP(id) {
    const p = P.find(x => x.id === id); if (!p) return;
    g('pId').value = p.id; g('pName').value = p.name; g('pCat').value = p.category; g('pSpecs').value = p.specs || '';
    g('pPrice').value = p.price; g('pOld').value = p.oldPrice || ''; g('pStock').value = p.stock; g('pRate').value = p.rating || ''; g('pImg').value = p.image;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function resetP() { document.querySelector('#t-products form').reset(); g('pId').value = ''; }
function delP(id) { if (!confirm('حذف المنتج؟')) return; P = P.filter(p => p.id !== id); S('hanzal_products', P); render(); }
function upImg(inp) {
    if (!inp.files[0]) return;
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), k = Math.min(1, 500 / im.width); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); g('pImg').value = c.toDataURL('image/jpeg', .7); }; im.src = r.result; };
    r.readAsDataURL(inp.files[0]);
}
function setSt(i, v) { O[i].status = v; S('hanzal_orders', O); }
function delO(i) { if (!confirm('حذف الطلب؟')) return; O.splice(i, 1); S('hanzal_orders', O); render(); }
function savePin(e) {
    e.preventDefault(); const n = f('newPin');
    if (n.length < 4) return alert('الرمز لا يقل عن 4 أرقام');
    localStorage.setItem('hanzal_admin_pin', n); alert('تم تغيير الرمز'); e.target.reset();
}
function backup() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ products: P, orders: O })], { type: 'application/json' }));
    a.download = 'hanzal-backup.json'; a.click();
}
function restore(inp) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); S('hanzal_products', d.products || []); S('hanzal_orders', d.orders || []); render(); alert('تم الاستيراد'); } catch (e) { alert('ملف غير صالح'); } };
    if (inp.files[0]) r.readAsText(inp.files[0]);
}

function dash() {
    const num = o => parseFloat(o.total) || 0, live = O.filter(o => o.status !== 'ملغي'), rev = live.reduce((s, o) => s + num(o), 0);
    g('stats').innerHTML = [['المنتجات', P.length, 'box', 'indigo'], ['إجمالي الطلبات', O.length, 'receipt', 'sky'], ['الإيرادات', rev + ' ج.م', 'coins', 'emerald'], ['متوسط قيمة الطلب', (live.length ? Math.round(rev / live.length) : 0) + ' ج.م', 'chart-line', 'violet'], ['طلبات جديدة', O.filter(o => o.status === ST[0]).length, 'bell', 'amber'], ['مخزون منخفض (≤5)', P.filter(p => p.stock <= 5).length, 'triangle-exclamation', 'rose']]
        .map(([a, b, i, c]) => `<div class="bg-white border rounded-2xl p-5 flex items-center gap-4"><div class="w-11 h-11 rounded-xl bg-${c}-100 text-${c}-600 flex items-center justify-center"><i class="fa-solid fa-${i}"></i></div><div><p class="text-xl font-black">${b}</p><p class="text-xs text-slate-500">${a}</p></div></div>`).join('');
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 6 + i); return d; });
    const vals = days.map(d => live.filter(o => o.ts >= +d && o.ts < +d + 864e5).reduce((s, o) => s + num(o), 0)), mx = Math.max(1, ...vals);
    g('chart').innerHTML = vals.map((v, i) => `<div class="flex-1 flex flex-col items-center justify-end gap-1 h-full"><span class="text-[10px] text-slate-500">${v || ''}</span><div class="w-full bg-gradient-to-t from-indigo-600 to-indigo-400 rounded-t-lg" style="height:${Math.max(4, v / mx * 110)}px"></div><span class="text-[10px] text-slate-400">${days[i].toLocaleDateString('ar-EG', { weekday: 'short' })}</span></div>`).join('');
    const row = (l, r) => `<div class="flex justify-between text-xs py-2 border-b last:border-0"><span>${l}</span>${r}</div>`;
    g('stBox').innerHTML = ST.map(s => row(s, `<b>${O.filter(o => o.status === s).length}</b>`)).join('');
    g('lastO').innerHTML = O.slice(0, 5).map(o => row(esc(o.id) + ' • ' + esc(o.name), `<b class="text-indigo-600">${esc(o.total)}</b>`)).join('') || '<p class="text-xs text-slate-400">لا توجد طلبات</p>';
    g('lowS').innerHTML = P.filter(p => p.stock <= 5).map(p => row(esc(p.name), `<b class="${p.stock <= 0 ? 'text-red-600' : 'text-amber-600'}">${p.stock <= 0 ? 'نفد' : p.stock}</b>`)).join('') || '<p class="text-xs text-slate-400">المخزون جيد ✓</p>';
    const col = { 'تم التسليم': 'bg-emerald-100 text-emerald-700', 'ملغي': 'bg-red-100 text-red-700', 'تم الشحن': 'bg-sky-100 text-sky-700' };
    g('oList').innerHTML = O.map((o, i) => `<div class="bg-white border rounded-2xl p-4 text-sm space-y-3" data-q="${esc(o.id + ' ' + o.name + ' ' + o.phone)}" data-st="${esc(o.status)}">
        <div class="flex justify-between items-start gap-2"><div><b>${esc(o.id)} • ${esc(o.name)}</b>
        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-phone"></i> ${esc(o.phone)} • <i class="fa-solid fa-location-dot"></i> ${esc(o.address)}</p>
        <p class="text-[11px] text-slate-400">${esc(o.date || '')} ${o.bostaRef ? '• ' + esc(o.bostaRef) : ''}</p></div>
        <span class="text-xs px-2 py-1 rounded-lg font-bold whitespace-nowrap ${col[o.status] || 'bg-amber-100 text-amber-700'}">${esc(o.status)}</span></div>
        <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-1">${o.items && o.items.length ? o.items.map(x => `<div class="flex justify-between"><span>${esc(x.name)} × ${+x.qty}</span><b>${+x.price * +x.qty} ج.م</b></div>`).join('') : '<span class="text-slate-400">تفاصيل المنتجات غير متوفرة (طلب قديم قبل التحديث)</span>'}

// ===== إحصائيات الزوار =====
async function loadVisits() {
    if (!g('visBox')) g('t-dash').insertAdjacentHTML('beforeend', '<div class="bg-white border rounded-2xl p-5"><div class="flex justify-between items-center mb-3"><h3 class="font-black text-sm">📊 الزوار (آخر 7 أيام)</h3><button onclick="loadVisits()" class="text-xs text-indigo-600 font-bold">تحديث</button></div><div id="visBox" class="text-xs text-slate-400">جارٍ التحميل...</div></div>');
    const box = g('visBox');
    if (!cloudOn()) { box.textContent = 'إحصائيات الزوار تحتاج ربط Firebase'; return; }
    try {
        const days = [...Array(7)].map((_, k) => new Date(Date.now() - (6 - k) * 864e5).toISOString().slice(0, 10));
        const data = await Promise.all(days.map(d => cGet('visits/' + d, true).then(x => Object.values(x || {}))));
        const all = data.flat(), today = data[6], ps = L('hanzal_products', []);
        const uniq = a => new Set(a.map(x => x.v)).size, cnt = (a, k) => a.filter(x => x.k === k).length;
        const top = (arr, f) => Object.entries(arr.reduce((m, x) => { const k = f(x); if (k) m[k] = (m[k] || 0) + 1; return m; }, {})).sort((x, y) => y[1] - x[1]).slice(0, 5);
        const dayUniq = data.map(uniq), mx = Math.max(1, ...dayUniq);
        const card = (l, v) => `<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-xl font-black">${v}</p><p class="text-[11px] text-slate-500">${l}</p></div>`;
        const live = new Set(today.filter(x => x.t > Date.now() - 3e5).map(x => x.v)).size;
        const nm = id => esc((ps.find(p => p.id === +id) || {}).name || '#' + id);
        const list = a => a.map(([k, n]) => `<div class="flex justify-between py-1 border-b last:border-0"><span>${k}</span><b>${n}</b></div>`).join('') || '<p class="text-slate-400">—</p>';
        const visits = all.filter(x => x.k === 'visit');
        box.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">${card('زوار اليوم', uniq(today))}${card('زوار 7 أيام', uniq(all))}${card('نشطين الآن (5 د)', live)}${card('زوار جدد اليوم', today.filter(x => x.k === 'visit' && x.n).length)}</div>
        <div class="flex items-end gap-1.5 h-24 mb-1">${dayUniq.map((v, k) => `<div class="flex-1 flex flex-col items-center justify-end gap-1 h-full"><span class="text-[10px] text-slate-500">${v || ''}</span><div class="w-full bg-gradient-to-t from-emerald-600 to-emerald-400 rounded-t" style="height:${Math.max(3, v / mx * 70)}px"></div><span class="text-[10px] text-slate-400">${days[k].slice(5)}</span></div>`).join('')}</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 my-4">${card('مشاهدات منتجات', cnt(all, 'view'))}${card('إضافة للسلة', cnt(all, 'cart'))}${card('بدء الطلب', cnt(all, 'checkout'))}${card('طلبات مكتملة', cnt(all, 'buy'))}</div>
        <div class="grid md:grid-cols-3 gap-4"><div><p class="font-bold mb-1">مصادر الزيارات</p>${list(top(visits, x => x.r === 'direct' ? 'مباشر' : esc(x.r)))}</div><div><p class="font-bold mb-1">الأجهزة</p>${list(top(visits, x => x.d === 'm' ? 'موبايل' : 'كمبيوتر'))}</div><div><p class="font-bold mb-1">أكثر المنتجات مشاهدة</p>${list(top(all.filter(x => x.k === 'view' && x.pid), x => x.pid).map(([k, n]) => [nm(k), n]))}</div></div>`;
    } catch (e) { box.textContent = 'تعذر تحميل الإحصائيات: ' + e.message + ' (لازم تحدّث قواعد Firebase بإضافة visits)'; }
}
loadVisits();
tab('dash');
</script>
