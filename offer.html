    const inp = 'w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-indigo-600';
    g('app').innerHTML = `
    <div class="bg-white rounded-3xl overflow-hidden border"><img id="m" src="${esc(imgs[0])}" class="w-full h-80 object-cover" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MDAgNDAwIj48cmVjdCB3aWR0aD0iNTAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2YxZjVmOSIvPjxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzk0YTNiOCIgc3Ryb2tlLXdpZHRoPSIxMCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB4PSIyMDUiIHk9IjEzMCIgd2lkdGg9IjkwIiBoZWlnaHQ9IjEwMCIgcng9IjI2Ii8+PHBhdGggZD0iTTIyNSAxMzBsNi0zNmgzOGw2IDM2TTIyNSAyMzBsNiAzNmgzOGw2LTM2Ii8+PHBhdGggZD0iTTI1MCAxNjB2MjhsMTggMTAiLz48L2c+PC9zdmc+'">${imgs.length > 1 ? `<div class="flex gap-2 p-2 overflow-x-auto">${imgs.map(u => `<img src="${esc(u)}" onclick="g('m').src=this.src" class="w-14 h-14 rounded-lg object-cover border shrink-0 cursor-pointer">`).join('')}</div>` : ''}</div>
    <div class="bg-white rounded-3xl border p-5 space-y-3">
      ${P.best ? '<span class="text-xs bg-amber-100 text-amber-700 font-bold px-2 py-1 rounded-lg">🔥 الأكثر مبيعاً</span>' : ''}
      <h1 class="text-xl font-black">${esc(P.name)}</h1><p class="text-sm text-slate-600">${esc(P.specs || '')}</p>
      <div class="flex items-baseline gap-2"><span class="text-3xl font-black text-indigo-600">${cur} ج.م</span><span class="text-slate-400 line-through">${old} ج.م</span></div>
      ${off ? '<div class="bg-red-50 text-red-600 rounded-xl p-3 text-center text-sm font-bold">ينتهي العرض بعد <span id="cd" class="font-black"></span></div>' : ''}
      ${cols.length ? `<div class="flex gap-2 flex-wrap">${cols.map((c, k) => `<button type="button" data-c="${esc(c)}" onclick="pick(this)" class="cb px-3 py-1 rounded-lg border text-xs font-bold ${k ? 'bg-white' : 'bg-slate-900 text-white'}">${esc(c)}</button>`).join('')}</div>` : ''}
      <p class="text-xs font-bold ${P.stock > 0 ? 'text-emerald-600' : 'text-red-600'}">${P.stock > 0 ? (P.stock <= 5 ? 'متبقي ' + P.stock + ' قطعة فقط!' : 'متوفر') : 'نفد المخزون'}</p>
    </div>
    ${P.stock > 0 ? `<form onsubmit="order(event)" class="bg-white rounded-3xl border p-5 space-y-3">
      <h2 class="font-black">اطلب الآن - الدفع عند الاستلام</h2>
      <input id="nm" required placeholder="الاسم بالكامل" class="${inp}">
      <input id="ph" required type="tel" placeholder="رقم الموبايل (01xxxxxxxxx)" class="${inp}">
      <select id="gv" required onchange="calc()" class="${inp} bg-white"><option value="">اختر المحافظة</option>${govs.map(x => `<option>${esc(x)}</option>`).join('')}</select>
      <input id="ad" required placeholder="العنوان بالتفصيل" class="${inp}">
      <select id="q" onchange="calc()" class="${inp} bg-white">${Array.from({ length: mq }, (_, i) => `<option value="${i + 1}">الكمية: ${i + 1}</option>`).join('')}</select>
      <div id="sm" class="bg-slate-50 rounded-xl p-3 text-xs space-y-1"></div>
      <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-black shadow-lg shadow-indigo-600/30">تأكيد الطلب</button>
    </form>` : ''}
    <a target="_blank" href="https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent('أرغب في طلب: ' + P.name)}" class="block text-center bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm"><i class="fa-brands fa-whatsapp"></i> استفسار عبر واتساب</a>
    <div class="grid grid-cols-3 gap-2 text-center text-[11px] font-bold text-slate-600"><div class="bg-white border rounded-xl p-3"><i class="fa-solid fa-truck-fast text-indigo-600 block text-lg mb-1"></i>شحن لكل المحافظات</div><div class="bg-white border rounded-xl p-3"><i class="fa-solid fa-shield-halved text-indigo-600 block text-lg mb-1"></i>ضمان استبدال</div><div class="bg-white border rounded-xl p-3"><i class="fa-solid fa-hand-holding-dollar text-indigo-600 block text-lg mb-1"></i>الدفع عند الاستلام</div></div>`;
    if (P.stock > 0) calc();
    if (off) { const t = () => { let s = Math.floor((+P.offerEnd - Date.now()) / 1000); if (s <= 0) return location.reload(); const d = Math.floor(s / 86400); g('cd').textContent = (d ? d + ' يوم ' : '') + [s % 86400 / 3600, s % 3600 / 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); }; t(); setInterval(t, 1000); }
}
function pick(b) { sel = b.dataset.c; document.querySelectorAll('.cb').forEach(x => x.className = 'cb px-3 py-1 rounded-lg border text-xs font-bold ' + (x === b ? 'bg-slate-900 text-white' : 'bg-white')); }
function calc() {
    const st = getSettings(), gv = g('gv').value, q = +g('q').value, sub = cur * q;
    let sh = gv ? (+parseKV(st.ship)[gv] || 0) : 0; if (+st.free > 0 && sub >= +st.free) sh = 0;
    g('sm').innerHTML = `<div class="flex justify-between"><span>المنتج × ${q}</span><span>${sub} ج.م</span></div><div class="flex justify-between"><span>الشحن</span><span>${gv ? (sh ? sh + ' ج.م' : 'مجاناً') : 'اختر المحافظة'}</span></div><div class="flex justify-between font-black text-sm border-t pt-1"><span>الإجمالي</span><span>${sub + sh} ج.م</span></div>`;
    return { sub, sh, gv, q, total: sub + sh };
}
function order(e) {
    e.preventDefault();
    const ph = g('ph').value.trim().replace(/\s/g, '');
    if (!/^(\+?20|0)?1[0125]\d{8}$/.test(ph)) return alert('أدخل رقم موبايل مصري صحيح (مثال: 01012345678)');
    const c = calc();
    const o = { id: '#' + Math.floor(100000 + Math.random() * 900000), name: g('nm').value.trim(), phone: ph, address: c.gv + ' - ' + g('ad').value.trim(), total: c.total + ' ج.م', status: 'قيد المراجعة', date: new Date().toLocaleString('ar-EG'), ts: Date.now(), gov: c.gv, subtotal: c.sub, shipping: c.sh, discount: 0, coupon: '', items: [{ id: P.id, name: P.name + (sel ? ' (' + sel + ')' : ''), qty: c.q, price: cur }] };
    const os = JSON.parse(localStorage.getItem('hanzal_orders') || '[]'); os.unshift(o); localStorage.setItem('hanzal_orders', JSON.stringify(os));
    const k = okey(o);
    if (cloudOn()) { cPut('orders/' + k, o).catch(() => {}); cPut('track/' + k, { status: o.status, total: o.total, date: o.date, bostaRef: '', items: [{ name: o.items[0].name, qty: c.q }] }).catch(() => {}); }
    if (typeof NOTIFY_URL !== 'undefined' && NOTIFY_URL) fetch(NOTIFY_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: o.id, name: o.name, phone: o.phone, address: o.address, gov: o.gov, coupon: '', total: o.total, subtotal: o.subtotal, shipping: o.shipping, discount: 0, items: o.items }) }).catch(() => {});
    track('Purchase', { value: c.total, currency: 'EGP' });
    const t = encodeURIComponent(`طلب جديد ${o.id}\nالاسم: ${o.name}\nالهاتف: ${o.phone}\nالعنوان: ${o.address}\n- ${o.items[0].name} × ${c.q}\nالإجمالي: ${o.total}`);
    g('app').innerHTML = `<div class="bg-white rounded-3xl border p-8 text-center space-y-3"><div class="text-5xl">✅</div><h2 class="font-black text-lg">تم استلام طلبك</h2><p class="text-sm text-slate-600">رقم طلبك <b>${esc(o.id)}</b> — احتفظ به لتتبع الطلب</p><p class="font-bold text-indigo-600">الإجمالي ${esc(o.total)} (الدفع عند الاستلام)</p><a target="_blank" href="https://wa.me/${STORE.whatsapp}?text=${t}" class="block bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm">أرسل تفاصيل الطلب على واتساب</a><a href="index.html" class="block text-xs text-slate-500 font-bold">تصفح باقي المنتجات</a></div>`;
    window.scrollTo(0, 0);
}
init();
</script>
