    <script>
        // إضافة: لو مسجّل دخول بالفعل ادخل مباشرة
        if (localStorage.getItem('hanzal_is_logged_in') === 'true') window.location.href = 'admin.html';

        function handleAdminLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('adminPin').value.trim();
            
            // رمز المرور الافتراضي 1234 (يمكنك تغييره أو جعله ديناميكياً)
            const correctPin = localStorage.getItem('hanzal_admin_pin') || "1234";

            if (pin === correctPin) {
                // حفظ حالة تسجيل الدخول في الجلسة
                localStorage.setItem('hanzal_is_logged_in', 'true');
                window.location.href = 'admin.html';
            } else {
                const errorEl = document.getElementById('errorMessage');
                errorEl.classList.remove('hidden');
                document.getElementById('adminPin').value = '';
            }
        }
    </script>
    <script>
        // إضافة: تسجيل الدخول عبر Firebase عند تفعيل السحابة
        if (cloudOn()) { document.getElementById('emailBox').classList.remove('hidden'); document.getElementById('adminEmail').required = true; }
        const _hl = handleAdminLogin;
        handleAdminLogin = async function (e) {
            if (!cloudOn()) return _hl(e);
            e.preventDefault();
            try {
                await cloudLogin(document.getElementById('adminEmail').value.trim(), document.getElementById('adminPin').value);
                const tk = await cloudToken(), chk = await fetch(CLOUD.db.replace(/\/$/, '') + '/orders.json?shallow=true&auth=' + tk);
                if (!chk.ok) { sessionStorage.removeItem('hz_tok'); throw new Error('NOT_ADMIN'); }
                localStorage.setItem('hanzal_is_logged_in', 'true'); window.location.href = 'admin.html';
            } catch (err) {
                const el = document.getElementById('errorMessage'); const m = String(err.message);
                el.textContent = /NOT_ADMIN/.test(m) ? 'هذا الحساب ليس حساب إدارة (أو قواعد Firebase لا تطابق إيميلك)' : /API_KEY|API key/i.test(m) ? 'مفتاح API في cloud.js غير صحيح' : /OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m) ? 'فعّل Email/Password من Authentication في Firebase' : /INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m) ? 'البريد أو كلمة المرور غير صحيحة' : 'خطأ: ' + m;
                el.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
